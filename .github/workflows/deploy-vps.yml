script: |
  set -eu

  echo "Usuario:"
  whoami

  echo "Diretorio inicial:"
  pwd

  echo "DEPLOY_PATH: '${{ vars.DEPLOY_PATH }}'"

  cd "${{ vars.DEPLOY_PATH }}"

  echo "Diretorio apos cd:"
  pwd

  echo "Verificando repositorio:"
  git status

  git fetch origin "${{ github.ref_name }}"
  git checkout --force "${{ github.ref_name }}"
  git reset --hard "${{ github.sha }}"

  docker compose \
    --env-file deploy/.env.production \
    -f deploy/compose.production.yml \
    up -d --build --remove-orphans
